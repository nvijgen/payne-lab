[project]
name = "proteincoronapredict-paynelab"
version = "0.1.0"
description = "Predicting protein corona abundance from nanoparticle and protein features."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib==3.10.7",
    "notebook==7.5.0",
    "numpy==2.3.5",
    "openpyxl==3.1.5",
    "pandas==2.3.3",
    "scikit-learn==1.7.2",
    "scipy==1.16.3",
    "shap==0.49.1",
    "statsmodels==0.14.6",
]


# Transitive pins, so a fresh lock reproduces the environment the results were produced in.
[tool.uv]
constraint-dependencies = [
    "llvmlite==0.46.0",
    "numba==0.63.1",
    "setuptools==82.0.1",
    "tqdm==4.67.1",
]
